# 10/19~ 차선 카메라를 오른쪽 → 정면으로 옮긴 뒤의 설정 (도경윤)
# 실행:
#   taskset -c 0-5 ros2 run lane_trace lane_trace --ros-args --params-file <이 파일>
#   taskset -c 0-5 ros2 run obs_evade obs_evade --ros-args --params-file <이 파일>
#
# 속도: 차선 주행 linear_speed 1.0 × th_scale 1000(s1_stack.yaml) → PWM 180 (S1 펌웨어 상한)
#       차선 변경 max_speed 1.0 × change_speed 0.7 × 1000 → PWM 126
# 10/17 bag(장애물 15회): PWM 57에서 실제 약 0.15 m/s, 차선 변경은 늘 장애물 약 1.35 m 앞에서 시작.
# 아래 시간·거리 값은 속도가 PWM에 비례한다고 보고(180 → 약 0.47 m/s, 126 → 약 0.33 m/s) 10/17 값을 환산한 시작값.
# 실제 속도를 재면 다시 맞출 것.
#
# 차선 기준값(guide_x/guide_slope, ROI 등)은 카메라를 옮겨서 obstacle_1017.yaml 값이 맞지 않음.
# 정면 카메라로 녹화한 bag을 보고 다시 맞출 예정 — 그 전에는 자동 주행하지 말 것.

lane_masking_node:            # lane_trace 노드 이름
  ros__parameters:
    linear_speed: 1.0
    # 차선을 놓친 뒤 마지막 조향으로 버티는 시간. 버티는 거리를 10/17과 같게: × 57/180
    lost_hold_s: 0.5          # 10/17: 1.5
    lost_hold_s_l1: 1.3       # 10/17: 4.0 (점선 칸 사이)
    # 정면 카메라: 방식 3(좌우 선을 따로 찾아 차로 중앙으로 조향). 1차선 주행·차선 변경 중에도 같은 방식
    detector: 3
    detector_l1: 3
    detector_change: 3
    l_min: 130                # 흰 선 밝기 하한 (10/17과 같음)
    s_max: 30                 # 흰 선 채도 상한 (10/17과 같음, 녹색 잔디 제외)
    # 방식 3 기준값: 10/19 2차선 직선 중앙에 세운 차에서 잼 (lane_trace 기본값과 같음, 여기서 바꿔 맞춤)
    guide_x_v3: 289.0         # y=300에서 차로 중앙 x (화면 가운데 320보다 31px 왼쪽 = 카메라가 약간 비켜 달림)
    guide_vp_v3: 296.0        # 소실점 x (왼쪽 선 x=-0.54y+222, 오른쪽 x=0.51y+366의 교점)
    vp_y_v3: -137.0           # 소실점 높이(px, 화면 위 밖). 한쪽 선만 보일 때 이 높이에서 그 선의 x를 소실점으로 씀
    # 조향(+ = 오른쪽) = b × (중앙 − 289) + a × (소실점 − 296). 펌웨어는 4° 이하 명령을 무시하므로(STEER_HYST_DEG)
    # 25px 밀리면 4° 넘게 나오도록. 10/19 1차 주행: 25px 밀릴 때 1~3°만 나와 실제로는 안 꺾임
    # 10/19 2차 주행(a 0.003, b 0.004): 차로 안에 머물렀으나 중앙이 283~342px를 약 1.5초 주기로 오가며 최대 22° → 약 30% 줄임
    a_rad_v3: 0.002           # 소실점 오차(px) 가중치. 5° 돌면 소실점 약 40px → 0.08 rad
    b_rad_v3: 0.003           # 중앙 위치 오차(px) 가중치. 25px → 0.075 rad(4.3°)
    steer_max_v3: 0.3         # 최대 조향(rad, 약 17°). 기본 0.4
    open_k_v3: 7              # 13이면 먼 쪽 실선이 끊어짐. 7이면 가운데 장애물 표시 박스의 가는 선은 지워짐
    roi_top_v3: 40            # 위쪽 40px(왼쪽 위 구석 바닥) 안 봄
    roi_bot_v3: 320           # 아래(보닛과 그 위 물건) 안 봄
    lane_width_v3: 459.0      # y=300에서 차로 폭(px). 한쪽 선만 보일 때 중앙 추정에 씀
    # 흰 선 밝기 기준 = 바닥 + l_rel × (상위 1% − 바닥), 최소 l_floor. usb_cam 영상은 어두워서(바닥 14, 선 121~130)
    # 고정 l_min 130으로는 못 잡음. 이 방식이면 어두운 영상 82, 밝은 영상 163 (둘 다 선만 통과, 잔디·박스 선 제외)
    l_rel_v3: 0.6
    l_floor_v3: 60

obs_evade:
  ros__parameters:
    mode: toggle
    start_lane: 0             # 출발 차선 자동 판단. start_len_px(450)는 오른쪽 카메라 기준이라 정면 카메라로 다시 맞춰야 함
    change_speed: 0.7         # PWM 126 (10/19 결정: 변경도 빠르게)
    mirror_to_lane2: true     # 1→2는 2→1을 좌우 반전 → 아래 _l1 값만 맞추면 됨
    # 전방 감지: 변경 시작 지점을 10/17(약 1.35 m)과 비슷하게(약 1.45 m, 조향이 다 꺾이는 동안 더 가므로 조금 앞).
    # 10/17 구간 1.3~1.45(폭 0.15 m)에 스캔 6번이면 0.47 m/s에서는 0.6초 동안 0.28 m를 가서 구간을 지나쳐 감지가 안 됨
    # → 구간을 넓히고 스캔 수를 줄임. 시작 지점 ≈ roi_far − (min_scans−1) × 0.1초 × 속도 = 1.6 − 0.14 ≈ 1.46 m
    roi_near: 1.3
    roi_far: 1.6              # 10/17: 1.45
    min_scans: 4              # 10/17: 6 (기본값). 0.3초
    # 10/17 bag 장애물 점 수(중앙값/하위 10%): 1.3 m 70/65, 1.5 m 51/30, 1.6 m 57/25. 30이면 1.5 m 넘어서
    # 가끔 한 스캔이 빠져 연속 횟수가 0으로 돌아가므로 조금 낮춤
    min_points: 25            # 10/17: 30 (기본값)
    rearm_delay_s: 1.0        # 10/17: 2.0 (기본값). 방금 피한 장애물 재감지 방지 — 빨라진 만큼 줄임
    # 2→1 (반전으로 1→2에도 씀). 시간 = 10/17 값 × 57/126(≈0.45)
    cam_min_s_l1: 1.4         # 10/17: 3.0
    cam_max_s_l1: 3.6         # 10/17: 8.0
    cam_cross_s_l1: 0.7       # 10/17: 1.5
    straighten_tol_l1: 0.3    # 기울기 기준이라 속도와 무관. 단 카메라가 바뀌어 다시 맞춰야 함
    straighten_max_s_l1: 2.3  # 10/17: 5.0
