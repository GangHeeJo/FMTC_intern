# 10/19~ 차선 카메라를 오른쪽 → 정면으로 옮긴 뒤의 설정 (도경윤)
# 실행:
#   taskset -c 0-5 ros2 run lane_trace lane_trace --ros-args --params-file <이 파일>
#   taskset -c 0-5 ros2 run obs_evade obs_evade --ros-args --params-file <이 파일>
#
# 속도: 차선 주행 linear_speed 1.0 × th_scale 1000(s1_stack.yaml) → PWM 180 (S1 펌웨어 상한)
#       차선 변경 max_speed 1.0 × change_speed 0.7 × 1000 → PWM 126
# 10/17 bag(장애물 15회): PWM 57에서 실제 약 0.15 m/s, 차선 변경은 늘 장애물 약 1.35 m 앞에서 시작.
# 아래 시간·거리 값은 속도가 PWM에 비례한다고 보고(180 → 약 0.47 m/s, 126 → 약 0.33 m/s) 10/17 값을 환산한 시작값.
# 실제 속도를 재면 다시 맞출 것.
#
# 차선 기준값(guide_x/guide_slope, ROI 등)은 카메라를 옮겨서 obstacle_1017.yaml 값이 맞지 않음.
# 정면 카메라로 녹화한 bag을 보고 다시 맞출 예정 — 그 전에는 자동 주행하지 말 것.

lane_masking_node:            # lane_trace 노드 이름
  ros__parameters:
    linear_speed: 1.0
    # 차선을 놓친 뒤 마지막 조향으로 버티는 시간. 버티는 거리를 10/17과 같게: × 57/180
    lost_hold_s: 0.5          # 10/17: 1.5
    lost_hold_s_l1: 1.3       # 10/17: 4.0 (점선 칸 사이)
    # 정면 카메라: 방식 3(좌우 선을 따로 찾아 차로 중앙으로 조향). 1차선 주행·차선 변경 중에도 같은 방식
    detector: 3
    detector_l1: 3
    detector_change: 3
    l_min: 130                # 흰 선 밝기 하한 (10/17과 같음)
    s_max: 30                 # 흰 선 채도 상한 (10/17과 같음, 녹색 잔디 제외)
    # 방식 3 기준값: 10/19 2차선 직선 중앙에 세운 차에서 잼 (lane_trace 기본값과 같음, 여기서 바꿔 맞춤)
    # y=300에서 목표 중앙 x. 차로 정중앙은 289(화면 가운데 320보다 31px 왼쪽 = 카메라가 약간 비켜 달림).
    # 10/19 커브 시험(bag_run_1734): 평균 294, 커브 뒤 직선 308로 점선 쪽 → 사용자 요청으로 실선 쪽으로 30px
    guide_x_v3: 259.0
    guide_vp_v3: 296.0        # 소실점 x (왼쪽 선 x=-0.54y+222, 오른쪽 x=0.51y+366의 교점)
    vp_y_v3: -137.0           # 소실점 높이(px, 화면 위 밖). 한쪽 선만 보일 때 이 높이에서 그 선의 x를 소실점으로 씀
    # 조향(+ = 오른쪽) = b × (중앙 − 289) + a × (소실점 − 296). 펌웨어는 4° 이하 명령을 무시하므로(STEER_HYST_DEG)
    # 25px 밀리면 4° 넘게 나오도록. 10/19 1차 주행: 25px 밀릴 때 1~3°만 나와 실제로는 안 꺾임
    # 10/19 2차 주행(a 0.003, b 0.004): 차로 안에 머물렀으나 중앙이 283~342px를 약 1.5초 주기로 오가며 최대 22° → 약 30% 줄임
    # 10/19 커브 시험(소실점 방식): 휜 실선을 직선으로 맞춰 화면 위 밖 소실점까지 늘리니 커브 앞에서 방향이 과장돼
    # 출발하자마자 왼쪽 최대(17°)로 꺾고 점선을 넘음 → 화면 안 앞쪽(y_look=200)의 차로 중앙으로 방향을 보고,
    # 선은 가까운 부분(fit_top=140 아래)만으로 맞춤. 조향 = b × (y300 중앙 − 289) + a × (y200 중앙 − 기준)
    # 같은 장면 비교: 커브 출발 17.2° → 7.7°, 직선 bag 절대평균 4.3° → 3.9° (사용자: 조향이 너무 큼)
    y_look_v3: 200
    fit_top_v3: 140
    a_rad_v3: 0.002           # 앞쪽(y=200) 중앙 오차(px) 가중치
    b_rad_v3: 0.002           # 가까운(y=300) 중앙 오차(px) 가중치. 25px → 0.05 rad(2.9°)
    # 최대 조향(rad). 0.25(14°)는 1차선 왼쪽 커브에서 부족(회피 6차) → 0.3(17°)
    steer_max_v3: 0.3
    # 커브: 점선 토막을 위로 이어 세로 150px 넘게 걸치면 2차식으로 맞추고 더 먼 y=130에서 중앙을 봄
    # (y=200에서는 커브가 덜 휘어 보여 회피 6차 1차선 왼쪽 커브에서 왼쪽 4~10°뿐 → 같은 장면 75.2초 5° → 13°)
    y_look_curve_v3: 130
    # 한쪽 선만 보일 때 기울기(dx/dy) 크기가 이보다 크면 안 씀(차 머리가 크게 돌아간 상태). 정상 주행은 커브까지 1.24 이내,
    # 회피 9차(bag_obs_1820) 넘김 직후 잘못 읽은 값은 1.34~1.58
    single_k_max_v3: 1.3
    # 적분 보정: 차가 왼쪽으로 끌려 목표보다 실선 쪽(1차선)·점선 쪽(2차선)에서 균형을 잡음(오른쪽 9~18°를 계속 내면서도
    # 1차선 반전 중앙 287~304, 목표 321). 25px 밀린 채 2초면 0.05 rad(약 3°) 더함, 최대 0.12 rad(약 7°)
    ki_v3: 0.001
    # 회피 7차(bag_obs_1813): 1차선 왼쪽 커브 동안 적분이 왼쪽으로 쌓여 커브 끝에서 안쪽 실선에 붙음
    # → 조향(적분 전)이 0.15 rad(약 9°) 미만일 때만 쌓고, 최대 0.12 → 0.06 rad(약 3.5°)
    int_max_v3: 0.06
    int_gate_v3: 0.15
    # 실선 우선(10/19 사용자 결정): 점선 쪽에서 옆 차로 선(1차 주행)·트랙 밖 흰 차(커브 출발)를 잡음.
    # 중앙 = 실선 − 차로 폭/2. 2차선 = 오른쪽 실선. R+ = 실선이 안 보일 때만 점선 + 차로 폭/2로 대신 따라감
    # (회피 5차 bag_obs_1757: 1차선 왼쪽 커브에서 안쪽 실선이 화면 밖으로 빠져 선을 놓치고 오른쪽으로 나감)
    sides_v3: R+
    # 선을 놓친 뒤 이 프레임 수(30 = 1초) 동안은 직전 위치 80px 안에서만 다시 찾음 — 커브에서 다시 보인 휜 실선
    # 조각을 엉뚱하게 잡아 오른쪽으로 꺾던 것 방지(같은 bag 163.4초). 기본 15
    track_frames_v3: 30
    max_thick_v3: 45.0        # 이보다 두꺼운 흰 덩어리(차체 등)는 선이 아님
    # 1차선: 반전하지 않고 오른쪽 점선을 따라감(10/19 사용자 결정). 1차선 = 차 오른쪽에 점선 → 2차선(오른쪽 실선)과 같은 구조.
    # 반전 방식(회피 3~5차)은 카메라 비켜 달림으로 기준값을 따로 맞춰야 했고, 왼쪽 커브에서 안쪽 실선이 화면 밖으로 빠짐.
    # 2→1 변경: 꺾는 동안 2차선 실선이 오른쪽으로 빠지고 점선이 들어오면 넘김. 1→2는 lane_mirror로 그 좌우 반전
    flip_on_lane_change: false
    flip_target: false
    # 1차선 목표 = 정중앙(사용자: 1차선은 실선에 붙지 않게). 2차선 정중앙 기준값과 같음
    guide_x_v3_l1: 289.0
    guide_vp_v3_l1: 296.0
    open_k_v3: 7              # 13이면 먼 쪽 실선이 끊어짐. 7이면 가운데 장애물 표시 박스의 가는 선은 지워짐
    roi_top_v3: 40            # 위쪽 40px(왼쪽 위 구석 바닥) 안 봄
    roi_bot_v3: 320           # 아래(보닛과 그 위 물건) 안 봄
    lane_width_v3: 459.0      # y=300에서 차로 폭(px). 한쪽 선만 보일 때 중앙 추정에 씀
    # 흰 선 밝기 기준 = 바닥 + l_rel × (상위 1% − 바닥), 최소 l_floor. usb_cam 영상은 어두워서(바닥 14, 선 121~130)
    # 고정 l_min 130으로는 못 잡음. 이 방식이면 어두운 영상 82, 밝은 영상 163 (둘 다 선만 통과, 잔디·박스 선 제외)
    l_rel_v3: 0.6
    l_floor_v3: 60

obs_evade:
  ros__parameters:
    mode: toggle
    start_lane: 2             # 자동 판단(0)은 start_len_px가 오른쪽 카메라 기준이라 아직 못 씀
    change_speed: 0.7         # PWM 126 (10/19 결정: 변경도 빠르게)
    mirror_to_lane2: true     # 1→2는 2→1을 좌우 반전 → 아래 _l1 값만 맞추면 됨
    # 차선 변경 순서(10/19 사용자 결정): 감지 → 왼쪽 최대 2초 → 잠깐 직진 → 오른쪽으로 머리를 정면으로 → lane_trace.
    # 시간 기반(timed): 단계별 조향(+1 = 왼쪽 최대)과 시간. 1→2는 부호 반대. 아래 cam_* 값은 이 모드에선 안 씀
    # (camera 모드는 새 선이 잡히면 일찍 넘겨 되꺾기·직진이 생략됨 — 회피 9차)
    change_mode: timed
    change_steer: [1.0, 0.0, -1.0]
    change_time_s: [2.0, 1.5, 2.0]   # 왼쪽 2초, 직진 1.5초(사용자 지시), 되돌리기 2초(같은 속도·각도라 꺾은 만큼). 시작값
    # 전방 감지: 변경 시작 지점을 10/17(약 1.35 m)과 비슷하게(약 1.45 m, 조향이 다 꺾이는 동안 더 가므로 조금 앞).
    # 10/17 구간 1.3~1.45(폭 0.15 m)에 스캔 6번이면 0.47 m/s에서는 0.6초 동안 0.28 m를 가서 구간을 지나쳐 감지가 안 됨
    # → 구간을 넓히고 스캔 수를 줄임. 시작 지점 ≈ roi_far − (min_scans−1) × 0.1초 × 속도 = 1.6 − 0.14 ≈ 1.46 m
    # 10/19 회피 1차(bag_obs_1739): 1.42 m에서 시작 — 사용자: 꺾는 타이밍은 좋았음
    roi_near: 1.3
    roi_far: 1.6              # 10/17: 1.45
    min_scans: 4              # 10/17: 6 (기본값). 0.3초
    # 10/17 bag 장애물 점 수(중앙값/하위 10%): 1.3 m 70/65, 1.5 m 51/30, 1.6 m 57/25. 30이면 1.5 m 넘어서
    # 가끔 한 스캔이 빠져 연속 횟수가 0으로 돌아가므로 조금 낮춤
    min_points: 25            # 10/17: 30 (기본값)
    rearm_delay_s: 1.0        # 10/17: 2.0 (기본값). 방금 피한 장애물 재감지 방지 — 빨라진 만큼 줄임
    # 2→1 (반전으로 1→2에도 씀). 시간 = 10/17 값 × 57/126(≈0.45)
    # 회피 8차(bag_obs_1815)에서 3.0(되꺾기 끝난 뒤에만 넘김)을 해 봤으나 사용자 판단: 이전(1.4)이 더 나음 → 되돌림
    cam_min_s_l1: 1.4         # 10/17: 3.0
    # 반전 영상에서 처음엔 차로 사이 점선이 잡혀(1차선 실선으로 착각) 3.6초 제한에 걸려 넘김(bag_obs_1739)
    cam_max_s_l1: 3.6         # 10/17: 8.0
    # 정면 카메라(10/19): 꺾는 동안 lane_trace가 반전 영상에서 1차선 왼쪽 실선을 찾음(처음 찾는 허용 200px).
    # 잡히면 직진·정면 복귀 없이 바로 lane_trace에 넘김(방향은 lane_trace의 앞쪽 중앙 오차가 바로잡음)
    # 왼쪽 최대로 이 시간만 꺾고 그 뒤 직진. 1.5초(bag_obs_1739)는 1차선에 다 들어가기 전에 정면을 봄,
    # 3.0초(bag_obs_1745)는 너무 돌아 점선을 다 넘고 1차선 바깥 쪽을 향함(넘겨받은 lane_trace가 오른쪽 최대로 되돌림) → 2.0초
    cam_turn_max_s_l1: 2.0
    # 2초 꺾고 바로 직진하면 1차선 안쪽(실선 쪽)으로 170px까지 들어감(회피 6차 bag_obs_1806) → 1초 되꺾은 뒤 직진
    cam_back_s_l1: 1.0
    # 새 선(점선)이 이만큼 연속 잡히면 넘김. 토막 사이 빈 곳 때문에 3프레임 연속이 잘 안 나와 매번 3.6초 제한으로 넘겨짐
    cam_found_frames: 2
    cam_cross_s_l1: 0.0       # 10/17: 1.5
    straighten_max_s_l1: 0.0  # 10/17: 5.0. 0 = 정면 복귀 없이 바로 넘김
